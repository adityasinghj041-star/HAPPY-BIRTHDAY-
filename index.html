<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Aditi!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 85%;
            width: 330px;
            z-index: 10;
            position: relative;
        }
        h1 { color: #d63384; font-size: 24px; margin: 10px 0; }
        
        /* Photo Frame Styling - Clear High Quality */
        .photo-frame {
            width: 100%;
            max-height: 380px;
            margin: 0 auto 15px auto;
            border-radius: 15px;
            border: 4px solid #d63384;
            padding: 4px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .photo-frame img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        .shayari {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            font-style: italic;
            margin: 15px 0;
            background: #fff0f5;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #d63384;
        }
