<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Aditi!</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 350px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #d63384;
            font-size: 22px;
            margin: 10px 0;
        }
        .photo-frame {
            width: 100%;
            height: 320px;
            border-radius: 15px;
            border: 4px solid #d63384;
            padding: 3px;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 15px;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        .shayari {
            font-size: 14px;
            line-height: 1.5;
            color: #444;
            font-style: italic;
            background: #fff0f5;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #d63384;
            margin-bottom: 15px;
        }
        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(214, 51, 132, 0.4);
            margin-top: 5px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        audio {
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 Happy Birthday Aditi! 🎂</h1>

        <!-- Photo Frame with ImgBB Direct Image -->
        <div class="photo-frame">
            <img src="https://i.ibb.co/FLbLCRqy/1000048135.jpg" alt="Aditi Photo" onerror="this.src='https://i.ibb.co/LdXvbhL/1000048135.jpg'">
        </div>
        
        <!-- Shayari -->
        <div class="shayari">
            "Khwahishon ke samandar me sabhi moti aapke hon,<br>
            Aapke dil me base har khwab poore hon!<br>
            Phool khilte rahein aapki zindagi ki raahon mein,<br>
            Har din aapke liye khushiyon se bhara ho!" ✨
        </div>

        <!-- Music Button -->
        <button class="btn" onclick="playCelebration()">🎵 Play Song & Celebrate ✨</button>

        <!-- Birthday Song Player -->
        <audio id="bdaySong" controls loop style="display:none;">
            <source src="https://ia800301.us.archive.org/28/items/HappyBirthdaySong_201802/Happy%20Birthday%20Song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        window.onload = function() {
            confetti({
                particleCount: 60,
                spread: 50,
                origin: { y: 0.6 }
            });
        };

        function playCelebration() {
            var song = document.getElementById("bdaySong");
            song.style.display = "block"; // Audio player dikhane lagega
            song.play().catch(error => {
                console.log(error);
            });

            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.5 }
            });
        }
    </script>

</body>
</html>
