<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 85%;
            width: 320px;
        }
        h1 { color: #d63384; font-size: 26px; margin-bottom: 10px; }
        p { font-size: 16px; line-height: 1.6; color: #555; }
        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(214, 51, 132, 0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎉 Happy Birthday! 🎉</h1>
        <p>Aapki zindagi me khushiyan hazar aayein,<br>Har din naye rang aur muskaan layein!</p>
        <button class="btn" onclick="alert('🎂 Wishing you a wonderful year ahead!')">Tap for Wish ✨</button>
    </div>

</body>
</html>
