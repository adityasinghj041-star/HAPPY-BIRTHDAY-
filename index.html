<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Aditi!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 85%;
            width: 330px;
            z-index: 10;
            position: relative;
        }
        h1 { color: #d63384; font-size: 24px; margin: 10px 0; }
        
        /* Photo Frame Styling - Clear High Quality */
        .photo-frame {
            width: 100%;
            max-height: 380px;
            margin: 0 auto 15px auto;
            border-radius: 15px;
            border: 4px solid #d63384;
            padding: 4px;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .photo-frame img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            image-rendering: -webkit-optimize-contrast;
        }

        .shayari {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            font-style: italic;
            margin: 15px 0;
            background: #fff0f5;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #d63384;
        }
        .btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        audio {
            margin-top: 15px;
            width: 100%;
            border-radius: 10px;
        }

        /* Floating Balloons Animation */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 30px;
            height: 40px;
            background-color: rgba(255, 99, 132, 0.7);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: float 8s infinite ease-in;
            z-index: 1;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 14px;
            width: 2px;
            height: 12px;
            background: #888;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Floating Balloons Background -->
    <div class="balloon" style="left: 10%; animation-duration: 7s; background: #ff4b5c;"></div>
    <div class="balloon" style="left: 30%; animation-duration: 9s; background: #ff416c;"></div>
    <div class="balloon" style="left: 50%; animation-duration: 6s; background: #ff4b2b;"></div>
    <div class="balloon" style="left: 70%; animation-duration: 8s; background: #d63384;"></div>
    <div class="balloon" style="left: 90%; animation-duration: 10s; background: #ff758c;"></div>

    <div class="card">
        <h1>🎉 Happy Birthday Aditi! 🎂</h1>

        <!-- Clear High Quality Photo Frame -->
        <div class="photo-frame">
            <img src="https://i.ibb.co/LdXvbhL/1000048135.jpg" alt="Aditi Photo Collage">
        </div>
        
        <p class="shayari">
            "Khwahishon ke samandar me sabhi moti aapke hon,<br>
            Aapke dil me base har khwab poore hon!<br>
            Phool khilte rahein aapki zindagi ki raahon mein,<br>
            Har din aapke liye khushiyon se bhara ho!" ✨
        </p>

        <button class="btn" onclick="playAndCelebrate()">🎵 Play Music & Celebrate ✨</button>

        <!-- Birthday Song -->
        <audio id="birthdaySong" loop preload="auto">
            <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a7315b.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        function playAndCelebrate() {
            var audio = document.getElementById("birthdaySong");
            audio.play().catch(function(error) {
                console.log("Audio play error: " + error);
            });

            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });
        }

        window.onload = function() {
            confetti({
                particleCount: 80,
                spread: 60,
                origin: { y: 0.5 }
            });
        };
    </script>

</body>
</html>
